name: Feature request
description: Suggest a Pokémon, move, item, mechanic or improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check the Roadmap in the README and the open issues first. English or Portuguese are both fine.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should be added or changed?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What would it make better or more fun?
